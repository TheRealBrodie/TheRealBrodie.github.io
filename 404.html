<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: black;
            color: white;
            font-family: 'Times New Roman', Times, serif;
            text-align: center;
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h1 id="message">Sorry, my dog ate this page. Please try again on ...</h1>

    <script>
        const days = ["Sunday.", "Monday.", "Tuesday.", "Wednesday.", "Thursday.", "Friday.", "Saturday."];
        const today = new Date();
        const tomorrowIndex = (today.getDay() + 1) % 7;
        const tomorrow = days[tomorrowIndex];

        document.getElementById("message").textContent = `Sorry, my dog ate this page. Please try again on ${tomorrow}`;
    </script>
</body>
</html>
